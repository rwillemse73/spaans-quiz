<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🇪🇸 Spaans leren</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header>
    <div>
      <h1>🇪🇸 Spaans leren</h1>
      <p class="sub">15 woorden per sessie</p>
    </div>
    <button id="resetBtn" class="small danger" title="Alle voortgang wissen">Reset</button>
  </header>

  <section id="home" class="screen">
    <div class="stats">
      <div><b id="activeCount">0</b><span>nog te leren</span></div>
      <div><b id="reviewCount">0</b><span>fouten</span></div>
      <div><b id="cycleCount">0</b><span>deze cyclus</span></div>
    </div>
    <button id="startBtn" class="start">START</button>
    <p class="hint">Goede antwoorden verdwijnen. Foute antwoorden komen terug in de volgende sessie.</p>
  </section>

  <section id="quiz" class="screen hidden">
    <div class="quizTop">
      <span id="progress">1 / 15</span>
      <span id="score">Goed: 0</span>
    </div>
    <div class="card">
      <div class="label">Wat betekent:</div>
      <div id="word" class="word"></div>
      <div id="type" class="type"></div>
      <div id="options" class="options"></div>
      <div id="feedback" class="feedback"></div>
      <button id="nextBtn" class="next hidden">Volgende</button>
    </div>
  </section>

  <section id="done" class="screen hidden">
    <div class="doneCard">
      <div class="big">🎉</div>
      <h2>Alle 15 gedaan!</h2>
      <p id="doneText"></p>
      <button id="againBtn" class="start">VOLGENDE RONDE</button>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
